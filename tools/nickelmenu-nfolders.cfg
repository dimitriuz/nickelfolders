# NickelMenu config snippet for NickelFolders -- NOT installed by anything in
# this repo. Append these two lines to NickelMenu's own config file on the
# device (typically /mnt/onboard/.adds/nm/config; see
# github.com/pgaskin/NickelMenu for where your install puts it) and reboot
# once for NickelMenu to pick them up.
#
# The first line shows the folder browser (nf_browser_show, nfview.cc) by
# touching its trigger file -- see nfolders.cc's own header comment for the
# full trigger protocol.
#
# The second line is DEV-ONLY: it restarts Nickel in place
# (tools/restart-nickel.sh) so a freshly pushed libnfolders.so takes effect
# without rebooting the device. It must be launched from NickelMenu (i.e.
# from inside Nickel) for its environment gate to pass at all -- see
# restart-nickel.sh's own comment, and CLAUDE.md's device-workflow section,
# for why, and for what to check on the device after using it for the first
# time. Do not add this item to a build meant for anyone but the person
# doing this development.
#
# restart-nickel.sh itself is installed separately (this file only adds the
# menu item that runs it) -- copy it to
# /mnt/onboard/.adds/nfolders/restart-nickel.sh and `chmod +x` it; the path
# below assumes exactly that location.

menu_item :main :NickelFolders        :cmd_spawn :quiet:/bin/touch /tmp/nfolders-native
menu_item :main :Restart Nickel (dev) :cmd_spawn :quiet:/mnt/onboard/.adds/nfolders/restart-nickel.sh
